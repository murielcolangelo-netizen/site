backend:
  name: git-gateway
  branch: main

media_folder: "static/uploads"
public_folder: "/static/uploads"

locale: "fr"

collections:
  - name: "galerie"
    label: "Galerie"
    files:
      - name: "oeuvres"
        label: "Œuvres"
        file: "content/galerie.json"
        description: "Ajoutez, supprimez ou réordonnez vos œuvres ici."
        fields:
          - label: "Œuvres"
            name: "oeuvres"
            widget: "list"
            summary: "{{fields.titre}}"
            fields:
              - {label: "Image", name: "image", widget: "image", required: true}
              - {label: "Titre", name: "titre", widget: "string"}
              - {label: "Technique", name: "technique", widget: "string", required: false}
              - {label: "Année", name: "annee", widget: "string", required: false}
              - {label: "Dimensions", name: "dimensions", widget: "string", required: false}

  - name: "site"
    label: "Informations du site"
    files:
      - name: "infos"
        label: "Photos, biographie, contact et expositions"
        file: "content/site.json"
        fields:
          - {label: "Photo d’accueil", name: "photo_accueil", widget: "image", required: false, hint: "Photo affichée à côté de votre nom sur l’accueil, sans recadrage. Indépendante de la photo À propos."}
          - {label: "Photo À propos", name: "portrait", widget: "image", required: false, hint: "Photo affichée uniquement dans la section À propos, sans recadrage."}
          - {label: "Lieu (ex. Née et travaille à Bruxelles)", name: "lieu", widget: "string"}
          - {label: "Biographie", name: "bio", widget: "text"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Pseudo Instagram", name: "instagram", widget: "string", required: false}
          - {label: "Lien Instagram (URL complète)", name: "instagram_url", widget: "string", required: false}
          - label: "Expositions (par ordre chronologique inverse)"
            name: "expositions"
            widget: "list"
            required: false
            hint: "Ajoutez une exposition avec le bouton +, ouvrez une entrée pour modifier son année, son titre et son lieu, ou supprimez-la. Glissez les entrées pour placer les plus récentes en premier, puis cliquez sur Publish pour publier."
            summary: "{{fields.annee}} — {{fields.titre}}"
            fields:
              - {label: "Année", name: "annee", widget: "string"}
              - {label: "Exposition", name: "titre", widget: "string"}
              - {label: "Lieu", name: "lieu", widget: "string"}
              - label: "Œuvres de cette exposition"
                name: "oeuvres"
                widget: "list"
                required: false
                summary: "{{fields.titre}}"
                hint: "Ajoutez une image depuis votre ordinateur ou la médiathèque. Glissez les œuvres pour choisir leur ordre d’affichage sous cette exposition."
                fields:
                  - {label: "Image", name: "image", widget: "image", required: true}
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Technique", name: "technique", widget: "string", required: false}
                  - {label: "Année", name: "annee", widget: "string", required: false}
                  - {label: "Dimensions", name: "dimensions", widget: "string", required: false}
