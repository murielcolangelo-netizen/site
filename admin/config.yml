backend:
  name: git-gateway
  branch: main

media_folder: "static/uploads"
public_folder: "/static/uploads"

locale: "fr"

collections:
  - name: "galerie"
    label: "Galerie"
    files:
      - name: "oeuvres"
        label: "Œuvres"
        file: "content/galerie.json"
        description: "Ajoutez, supprimez ou réordonnez vos œuvres ici."
        fields:
          - label: "Œuvres"
            name: "oeuvres"
            widget: "list"
            summary: "{{fields.titre}}"
            fields:
              - {label: "Image", name: "image", widget: "image", required: true}
              - {label: "Titre", name: "titre", widget: "string"}
              - {label: "Technique", name: "technique", widget: "string", required: false}
              - {label: "Année", name: "annee", widget: "string", required: false}
              - {label: "Dimensions", name: "dimensions", widget: "string", required: false}

  - name: "site"
    label: "Informations du site"
    files:
      - name: "infos"
        label: "Photos, biographie, contact et expositions"
        file: "content/site.json"
        fields:
          - {label: "Photo de fond de l’accueil", name: "fond_accueil", widget: "image", required: false, hint: "Importez votre nouvelle photo : elle apparaît derrière le nom et le portrait, sans découpe. Retirez-la pour revenir au fond uni."}
          - {label: "Transparence du fond (%)", name: "transparence_fond_accueil", widget: "number", value_type: "int", min: 0, max: 100, step: 1, default: 80, required: false, hint: "80 = photo discrète ; 0 = photo pleinement visible ; 100 = photo invisible. Ce réglage ne modifie ni le texte ni le portrait."}
          - {label: "Photo À propos", name: "portrait", widget: "image", required: false, hint: "Photo affichée uniquement dans la section À propos, sans recadrage."}
          - {label: "Lieu (ex. Née et travaille à Bruxelles)", name: "lieu", widget: "string"}
          - {label: "Biographie", name: "bio", widget: "text"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Pseudo Instagram", name: "instagram", widget: "string", required: false}
          - {label: "Lien Instagram (URL complète)", name: "instagram_url", widget: "string", required: false}
          - label: "Expositions (par ordre chronologique inverse)"
            name: "expositions"
            widget: "list"
            required: false
            hint: "Ajoutez une exposition avec le bouton +, ouvrez une entrée pour modifier son année, son titre et son lieu, ou supprimez-la. Glissez les entrées pour placer les plus récentes en premier, puis cliquez sur Publish pour publier."
            summary: "{{fields.annee}} — {{fields.titre}}"
            fields:
              - {label: "Année", name: "annee", widget: "string"}
              - {label: "Exposition", name: "titre", widget: "string"}
              - {label: "Lieu", name: "lieu", widget: "string"}
              - label: "Œuvres de cette exposition"
                name: "oeuvres"
                widget: "list"
                required: false
                summary: "{{fields.titre}}"
                hint: "Ajoutez une image depuis votre ordinateur ou la médiathèque. Glissez les œuvres pour choisir leur ordre d’affichage sous cette exposition."
                fields:
                  - {label: "Image", name: "image", widget: "image", required: true}
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Technique", name: "technique", widget: "string", required: false}
                  - {label: "Année", name: "annee", widget: "string", required: false}
                  - {label: "Dimensions", name: "dimensions", widget: "string", required: false}

  - name: "textes"
    label: "Textes du site"
    files:
      - name: "textes"
        label: "Tous les textes et libellés"
        file: "content/textes.json"
        fields:
          - {"label":"Titre de l’onglet","name":"titre_page","widget":"string","required":false}
          - {"label":"Nom dans le menu","name":"logo","widget":"string","required":false}
          - {"label":"Activité","name":"activite","widget":"string","required":false}
          - {"label":"Nom — première ligne","name":"prenom","widget":"string","required":false}
          - {"label":"Nom — deuxième ligne","name":"nom","widget":"string","required":false}
          - {"label":"Citation d’accueil","name":"citation","widget":"text","required":false}
          - {"label":"Lieu sur l’accueil","name":"lieu_accueil","widget":"string","required":false}
          - {"label":"Menu — Œuvres","name":"menu_oeuvres","widget":"string","required":false}
          - {"label":"Titre de section — Œuvres","name":"titre_oeuvres","widget":"string","required":false}
          - {"label":"Numéro de section — Œuvres","name":"numero_oeuvres","widget":"string","required":false}
          - {"label":"Menu — À propos","name":"menu_apropos","widget":"string","required":false}
          - {"label":"Titre de section — À propos","name":"titre_apropos","widget":"string","required":false}
          - {"label":"Numéro de section — À propos","name":"numero_apropos","widget":"string","required":false}
          - {"label":"Menu — Expositions","name":"menu_expositions","widget":"string","required":false}
          - {"label":"Titre de section — Expositions","name":"titre_expositions","widget":"string","required":false}
          - {"label":"Numéro de section — Expositions","name":"numero_expositions","widget":"string","required":false}
          - {"label":"Menu — Contact","name":"menu_contact","widget":"string","required":false}
          - {"label":"Titre de section — Contact","name":"titre_contact","widget":"string","required":false}
          - {"label":"Numéro de section — Contact","name":"numero_contact","widget":"string","required":false}
          - {"label":"Phrase de contact","name":"contact_intro","widget":"text","required":false}
          - {"label":"Note de contact","name":"contact_note","widget":"string","required":false}
          - {"label":"Copyright","name":"copyright","widget":"string","required":false}
          - {"label":"Signature de pied de page","name":"signature","widget":"string","required":false}
          - {"label":"Bouton de fermeture","name":"fermer","widget":"string","required":false}
          - {"label":"Message de chargement","name":"chargement","widget":"string","required":false}
          - {"label":"Description pour les moteurs de recherche","name":"description","widget":"text","required":false}
          - {"label":"Mention sur le portrait","name":"portrait_label","widget":"string","required":false}
          - {"label":"Description de la photo À propos","name":"alt_portrait","widget":"string","required":false}
          - {"label":"Libellé d’agrandissement","name":"agrandir","widget":"string","required":false}
          - {"label":"Description d’image par défaut","name":"image","widget":"string","required":false}
          - {"label":"Titre de la vue agrandie","name":"image_agrandie","widget":"string","required":false}
          - {"label":"Titre d’œuvre par défaut","name":"oeuvre_exposee","widget":"string","required":false}
          - {"label":"Message de galerie indisponible","name":"galerie_vide","widget":"string","required":false}
          - {"label":"Préfixe des numéros d’œuvres","name":"prefixe_numero","widget":"string","required":false}
